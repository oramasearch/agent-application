[project]
name = "agent-application"
version = "0.2.1"
description = "Builds and deploys lake Apps after explicit confirmation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.19.2",
]

[project.scripts]
agent-application-serve = "agent_application:serve"
application-agent-evals = "agent_application.evals:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "orama-app-runtime @ git+https://github.com/oramasearch/app-runtime.git@692faac963a1efc1722840d51214aa08777ae735",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

